name: Android CI

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      APK_DIR: app/build/outputs/apk/release
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        env:
          KEYSTORE: ${{ github.workspace }}/key.jks
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > "$KEYSTORE"
          ./gradlew build
      - name: Generate APK matrix
        id: matrix
        run: |
          FILES_JSON=$(find "$APK_DIR" -type f -name "*.apk" -printf "%f\n" | jq -R . | jq -s -c .)
          echo "matrix=$FILES_JSON" >> $GITHUB_OUTPUT
      - name: Upload all APKs as zip
        uses: actions/upload-artifact@v7
        id: upload
        with:
          name: all.zip
          path: ${{ env.APK_DIR }}/*.apk
  upload:
    needs: build
    runs-on: ubuntu-slim
    strategy:
      matrix:
        apk: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.apk }}
          archive: false